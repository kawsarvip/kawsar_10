<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Download - Verification</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            background-size: 300% 300%;
            animation: gradientMove 10s ease infinite;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: rgba(20, 24, 39, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 40px 25px;
            border-radius: 28px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #ff007f, #7928ca, #0070f3, #00dfd8);
        }
        .icon-box {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, rgba(121, 40, 202, 0.2), rgba(0, 112, 243, 0.2));
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 32px;
            color: #00dfd8;
            box-shadow: 0 0 25px rgba(0, 223, 216, 0.2);
        }
        h2 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 20px;
            margin: 12px 0;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.15);
        }
        .btn-tiktok {
            background: linear-gradient(135deg, #000000, #222222);
        }
        .btn-fb {
            background: linear-gradient(135deg, #1877f2, #0052cc);
        }
        .btn-telegram {
            background: linear-gradient(135deg, #0088cc, #006699);
        }
        
        /* লক করা ডাউনলোডের স্টাইল */
        .btn-proceed {
            background: #334155;
            color: #94a3b8;
            margin-top: 20px;
            font-size: 16px;
            pointer-events: none;
            opacity: 0.5;
            transition: all 0.4s ease;
        }
        /* আনলক হলে যে সুন্দর রঙ আসবে */
        .btn-proceed.unlocked {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            pointer-events: auto;
            opacity: 1;
            box-shadow: 0 10px 25px rgba(0, 176, 155, 0.4);
            animation: pulseBtn 1.5s infinite;
        }
        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .btn i {
            margin-right: 12px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-box">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h2>Verification Required</h2>
        <p>ফাইলটি আনলক করতে নিচের ৩টি টাস্ক কমপ্লিট করুন:</p>
        
        <!-- ১. টিকটক লিংক (ফরেড রিডাইরেক্ট ফিক্সড) -->
        <a href="https://www.tiktok.com/@Mdkawssr10" class="btn btn-tiktok" target="_blank" rel="noopener noreferrer" onclick="unlockStep(1)">
            <i class="fab fa-tiktok"></i> <span id="t1-text">1. Follow on TikTok</span>
        </a>
        
        <!-- ২. ফেসবুক লিংক -->
        <a href="https://www.facebook.com/profile.php?id=61553032553853" class="btn btn-fb" target="_blank" rel="noopener noreferrer" onclick="unlockStep(2)">
            <i class="fab fa-facebook-f"></i> <span id="t2-text">2. Follow Facebook ID</span>
        </a>
        
        <!-- ৩. টেলিগ্রাম চ্যানেল লিংক -->
        <a href="https://t.me/kawsarmods44" class="btn btn-telegram" target="_blank" rel="noopener noreferrer" onclick="unlockStep(3)">
            <i class="fab fa-telegram-plane"></i> <span id="t3-text">3. Join Telegram Channel</span>
        </a>

        <!-- লক করা ডাউনলোড বাটন -->
        <a href="download.html" id="downloadBtn" class="btn btn-proceed">
            <i class="fas fa-lock" id="lockIcon"></i> Continue to Download
        </a>
    </div>

    <script>
        let clicked = { 1: false, 2: false, 3: false };

        function unlockStep(step) {
            clicked[step] = true;
            
            // যেটিতে ক্লিক করা হয়েছে সেটিতে টিক মার্ক দেখাবে
            if(step === 1) document.getElementById('t1-text').innerHTML = "1. TikTok Followed ✓";
            if(step === 2) document.getElementById('t2-text').innerHTML = "2. Facebook Followed ✓";
            if(step === 3) document.getElementById('t3-text').innerHTML = "3. Telegram Joined ✓";

            // তিনটি কমপ্লিট হলেই কেবল নিচের ডাউনলোড বাটন আনলক হবে
            if (clicked[1] && clicked[2] && clicked[3]) {
                let btn = document.getElementById('downloadBtn');
                btn.classList.add('unlocked');
                document.getElementById('lockIcon').className = "fas fa-check-circle";
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Continue to Download';
            }
        }
    </script>
</body>
</html>
