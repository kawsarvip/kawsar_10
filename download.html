    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #09122c, #001f3f, #1a0033);
            background-size: 300% 300%;
            animation: gradientMove 10s ease infinite;
            color: #ffffff;
            display: flex;

        @keyframes gradientMove {

        .card {

            -webkit-backdrop-filter: blur(25px);

            padding: 40px 25px;
            border-radius: 28px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #00b09b, #96c93d);
        }
        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(0, 176, 155, 0.15);

            font-size: 36px;
            color: #00efd1;
            box-shadow: 0 0 30px rgba(0, 239, 209, 0.25);
            animation: pulseIcon 2s infinite;
        }
        @keyframes pulseIcon {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 239, 209, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(0, 239, 209, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 239, 209, 0); }
        }
        h2 {

            font-size: 24px;
            font-weight: 700;

            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px dashed #38bdf8;
        }
        .manual-link:hover {
            color: #7dd3fc;
        }
        .loader {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #00efd1;
            border-radius: 50%;
            animation: bounceDot 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounceDot {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
